# Ambiente de desenvolvimento do Guide.app: banco + API + front-end.
# Uso: copie .env.example para .env, defina DB_PASSWORD e rode: docker compose up --build
# Front-end: http://localhost:5173 · API: http://localhost:8081 · Banco: localhost:5433
# As portas ficam presas a 127.0.0.1: só esta máquina acessa.
# A senha do banco não tem valor padrão: vem só do .env (ignorado pelo git).
# Banco na 5433 e API na 8081 para não disputar a 5432 e a 8080 com um PostgreSQL (e o PEM) instalados na máquina.

services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: ${DB_NAME:-guide}
      POSTGRES_USER: ${DB_USER:-guide}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env (copie de .env.example)}
    ports:
      - "127.0.0.1:${DB_PORTA_HOST:-5433}:5432"
    volumes:
      - dados-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-guide}
      DB_USER: ${DB_USER:-guide}
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env (copie de .env.example)}
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      db:
        condition: service_healthy

  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev"
    environment:
      VITE_API_PROXY: http://api:8081
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules # node_modules do container, separado do Windows
    depends_on:
      - api

volumes:
  dados-db:

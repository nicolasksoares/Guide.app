spring:
  application:
    name: guide-api
  # Segredos vêm de variáveis de ambiente ou do .env da raiz (ignorado pelo git).
  # Fora do Docker, o .env é lido por app.guide.compartilhado.config.DotenvEnvironmentPostProcessor,
  # com as mesmas regras do Docker Compose (aspas, comentários).
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${DB_PORTA_HOST:5433}/${DB_NAME:guide}}
    username: ${DB_USER:guide}
    password: ${DB_PASSWORD:} # sem valor padrão: defina no .env
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # o schema é responsabilidade do Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8081} # 8080 costuma estar ocupada (ex.: PEM do PostgreSQL)

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

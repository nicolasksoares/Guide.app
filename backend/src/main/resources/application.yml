spring:
  application:
    name: guide-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/guide}
    username: ${DB_USER:guide}
    password: ${DB_PASSWORD:guide}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # o schema é responsabilidade do Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
